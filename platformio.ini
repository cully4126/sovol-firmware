; platformio.ini - Marlin build environment guidance
; IMPORTANT: Confirm the correct environment name for your SKR E3 V3/STM32F103 in Marlin's platformio envs.
; Common env names for BTT SKR E3 V3 / STM32F103 might include:
;   STM32F103RC_btt_SKR_E3_V3
;   STM32F103RC_btt_skr_e3_v3
; If build fails with "Unknown board" pick the right env from Marlin's /platformio-setup output or tell me and I'll update.

[env:STM32F103RC_btt_SKR_E3_V3]
platform = ststm32
board = genericSTM32F103RC
framework = arduino
build_flags = 
  ; See Configuration.h for key defines — do not duplicate board macros here.
  -D HAL_STM32F1
lib_deps =
  ; Add any needed libs here if Marlin requires them (PlatformIO usually manages)
src_dir = Marlin

; If the above env doesn't match your Marlin release, replace env with the exact name from the Marlin repository.
; Example CLI build:
;   pio run -e STM32F103RC_btt_SKR_E3_V3
; or to list environments:
;   pio run -t envdump
